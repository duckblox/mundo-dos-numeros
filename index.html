<!doctype html>
<html lang="pt-BR">
  <!--
    MUNDO DOS NÚMEROS COM O ZECA  ·  guia de leitura deste arquivo
    ================================================================
    Este jogo inteiro cabe em UM arquivo. Ele junta as 3 tecnologias da web:
    
      1) HTML  → a ESTRUTURA   (o que existe na página: botões, títulos, telas)
      2) CSS   → a APARÊNCIA   (cores, tamanhos, animações)  → fica dentro de <style>
      3) JavaScript → o COMPORTAMENTO (o que acontece quando alguém clica,
                      arrasta, acerta ou erra)               → fica dentro de <script>
    
    ORDEM SUGERIDA DE LEITURA
      a) <body> logo abaixo: é curtinho! Veja que as telas do jogo NÃO estão aqui.
      b) <style>: leia de cima para baixo; cada bloco tem um comentário.
      c) <script>: leia as seções na ordem em que aparecem (cada uma começa com
         uma faixa "=====" e uma explicação do que você vai aprender).
    
    CONCEITOS E ONDE VER CADA UM (procure pelo nome da seção)
      • Variáveis CSS e animações .......... <style> → :root e @keyframes
      • DOM (criar/alterar elementos) ...... "Utilidades" (função el) e "Roteamento"
      • Eventos (clique, teclado, ponteiro)  "Teclado numérico" e "Arrastar e soltar"
      • Canvas 2D (desenhar com código) .... "Zeca, o mascote", "Confete e fundo"
      • Animação com requestAnimationFrame . "Confete e fundo" e "Roteamento"
      • Som e música sem arquivos (WebAudio)  "Som (WebAudio...)" e "Música de parque"
      • Salvar no navegador (localStorage) . "Estado salvo"
      • Async/await e Promises .............. função sleep e renderMult → skipCount
      • Matemática de um mundo 3D .......... "CONTINHAS COM MATERIAL DOURADO 3D"
      • Variáveis, if, while, interpretador  "PARQUE LÓGICO" (renderParque, função rodar)
      • Geração de problemas aleatórios .... genOuro e os render* de cada atividade
    
    COMO EXPERIMENTAR
      1. Abra este arquivo no navegador (duplo clique) e aperte F12 para ver o console.
      2. Mude uma cor em :root (ex.: --soma) e atualize a página (F5): viu a diferença?
      3. No JS, mude o número de missões por rodada (procure "R[id] >= 5") e teste.
  -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mundo dos Números com o Zeca</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>"
    />
    <style>
      /* VARIÁVEIS CSS (custom properties): definimos cada cor UMA vez aqui e usamos
         com var(--nome) no resto do CSS. Quer outro tema? Mude só estas linhas!
         Cada operação tem sempre a MESMA cor (previsibilidade ajuda a aprender). */
      :root {
        --ink: #27324a;
        --soft: #6b7694;
        --soma: #ff8a5b;
        --sub: #8b6cff;
        --mult: #16b8a6;
        --div: #ff5d8f;
        --tab: #f2a900;
        --bal: #3a86ff;
        --pausa: #6c8cff;
        --ouro: #d99a00;
        --parque: #5b3fd9;
        --home: #3d5a80;
        --shadow: 0 10px 28px rgba(39, 50, 74, 0.13);
      }

      /* O seletor * vale para TODOS os elementos. border-box faz width/height já incluírem borda e espaçamento (cálculo de tamanhos fica bem mais simples). */
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      /* 1rem = tamanho da fonte do <html> (20px aqui). Todo texto em "rem" cresce junto quando o botão A+ dos Ajustes muda este valor. */
      html {
        font-size: 20px;
      }

      /* Fundo em degradê (linear-gradient) com "fixed": o fundo não rola junto com a página. */
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(160deg, #fff6e5 0%, #eaf6ff 55%, #f3ecff 100%);
        background-attachment: fixed;
      }

      /* position: fixed + inset: 0 estica o canvas pela tela toda. z-index define quem fica na frente: maior = mais na frente. */
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* pointer-events: none deixa os cliques "atravessarem" o confete para chegar nos botões que estão por baixo. */
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 900;
        pointer-events: none;
      }
      #app {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 14px 40px;
      }

      /* Botões começam sem estilo (sem borda/fundo) para cada tipo de botão decidir seu visual. "font: inherit" faz herdarem a fonte da página. */
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        color: inherit;
        background: none;
      }

      /* ACESSIBILIDADE: contorno bem visível quando alguém navega pelo teclado (tecla Tab). */
      button:focus-visible,
      input:focus-visible {
        outline: 4px solid #1b6ef3;
        outline-offset: 3px;
      }

      /* Cabeçalho: mascote + balão */
      /* FLEXBOX: display:flex coloca filhos lado a lado; gap é o espaço entre eles; flex-wrap deixa quebrar linha em telas estreitas. */
      #top {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      #mascot {
        width: 150px;
        height: 150px;
        flex: none;
      }
      #bubble {
        position: relative;
        flex: 1 1 280px;
        min-width: 240px;
        background: #fff;
        border-radius: 26px;
        padding: 16px 20px;
        font-size: 1.3rem;
        font-weight: 700;
        line-height: 1.35;
        box-shadow: var(--shadow);
        display: flex;
        gap: 10px;
        align-items: center;
        border: 4px solid #ffd166;
      }

      /* TRUQUE DO TRIÂNGULO: um elemento vazio com bordas grossas e transparentes vira uma "setinha". Aqui é o rabinho do balão de fala. */
      #bubble::before {
        content: "";
        position: absolute;
        left: -18px;
        top: 50%;
        margin-top: -14px;
        border: 14px solid transparent;
        border-right: 18px solid #ffd166;
        border-left: 0;
      }
      #bubble.pop {
        animation: popin 0.35s;
      }
      #bubbleText {
        flex: 1;
      }
      .mini {
        background: #fff4d6;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
        flex: none;
      }
      #hud {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
      }
      .pill {
        background: #fff;
        border-radius: 999px;
        padding: 8px 16px;
        font-weight: 800;
        box-shadow: var(--shadow);
        font-size: 1.05rem;
        white-space: nowrap;
        text-align: center;
      }
      @media (max-width: 640px) {
        #bubble::before {
          display: none;
        }
        #mascot {
          width: 110px;
          height: 110px;
        }
        #hud {
          flex-direction: row;
          width: 100%;
        }
        #hud .pill {
          flex: 1;
        }
      }

      #hud {
        flex-wrap: wrap; /* com 4 botões, deixa quebrar linha em telas estreitas */
      }

      /* Abas */
      /* overflow-x:auto permite rolar as abas para o lado no celular; scroll-snap faz elas "encaixarem" ao rolar. */
      #tabs {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 16px 4px 12px;
        scroll-snap-type: x proximity;
      }

      /* border-bottom colorida usa var(--c): cada aba define a sua --c direto pelo JavaScript (style.setProperty). */
      .tab {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 94px;
        padding: 10px 12px;
        border-radius: 22px;
        background: #fff;
        box-shadow: var(--shadow);
        font-weight: 800;
        font-size: 0.85rem;
        border-bottom: 7px solid var(--c);
        transition: transform 0.15s;
        scroll-snap-align: start;
      }
      .tab .ic {
        font-size: 1.9rem;
      }
      .tab:hover {
        transform: translateY(-3px);
      }
      .tab.on {
        background: var(--c);
        color: #fff;
        transform: translateY(-3px);
      }

      /* backdrop-filter: blur() desfoca o que está atrás, dando efeito de vidro fosco. animation: popin faz a tela "surgir" ao trocar de aba. */
      #stage {
        background: rgba(255, 255, 255, 0.84);
        backdrop-filter: blur(6px);
        border-radius: 32px;
        padding: 20px;
        box-shadow: var(--shadow);
        min-height: 440px;
        animation: popin 0.3s;
      }
      @media (max-width: 640px) {
        #stage {
          padding: 12px;
          border-radius: 24px;
        }
      }

      /* Missões */
      /* Estilos comuns a todas as atividades: cabeçalho da missão, níveis, bolinhas de progresso e a conta em destaque. */
      .mhead {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 4px dashed rgba(0, 0, 0, 0.08);
      }
      .mhead h2 {
        margin: 0;
        font-size: 1.7rem;
        color: var(--c);
      }
      .levels {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .lvbtn {
        padding: 8px 14px;
        border-radius: 999px;
        background: #eef1f9;
        font-weight: 800;
        font-size: 0.85rem;
      }
      .lvbtn.on {
        background: var(--c);
        color: #fff;
      }
      .dots {
        display: flex;
        gap: 8px;
      }
      .dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #e4e8f2;
        display: grid;
        place-items: center;
        font-size: 0.95rem;
        transition: background 0.3s;
      }
      .dot.full {
        background: #ffd166;
      }

      /* ::after cria um elemento "virtual" depois do .dot. Quando a bolinha ganha a classe "full", aparece uma estrela via content. */
      .dot.full::after {
        content: "⭐";
      }
      .story {
        font-size: 1.5rem;
        font-weight: 800;
        text-align: center;
        margin: 6px 0 10px;
      }
      .story b {
        color: var(--c);
        font-size: 1.15em;
      }

      /* Layout da conta (3 + 4 = ?). Cada número é um "cartão" (.n); o resultado (.r) usa a cor da atividade. */
      .eq {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        font-size: 2.6rem;
        font-weight: 900;
        margin: 6px 0 14px;
        flex-wrap: wrap;
      }
      .eq .n {
        background: #fff;
        border-radius: 18px;
        padding: 2px 18px;
        box-shadow: var(--shadow);
        min-width: 76px;
        text-align: center;
      }
      .eq .op {
        color: var(--c);
      }
      .eq .r {
        background: var(--c);
        color: #fff;
      }
      .trays {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .tray {
        flex: 1 1 280px;
        background: #fff;
        border-radius: 24px;
        padding: 12px;
        border: 4px dashed rgba(0, 0, 0, 0.1);
        min-height: 130px;
      }
      .tray.A {
        background: #fff3ec;
      }
      .tray.B {
        background: #eef8ff;
      }
      .tray.T {
        background: #fff;
        max-width: 860px;
        margin: 0 auto;
      }
      .tlabel {
        font-weight: 800;
        font-size: 0.9rem;
        color: var(--soft);
        margin-bottom: 6px;
      }
      .pile {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        min-height: 58px;
      }
      .zone {
        border-radius: 26px;
        transition:
          background 0.15s,
          box-shadow 0.15s,
          transform 0.15s;
      }

      /* Classe aplicada pelo JavaScript enquanto uma peça é arrastada por cima da zona: o brilho avisa "pode soltar aqui!". */
      .zone.hot {
        box-shadow:
          0 0 0 6px var(--c),
          0 0 30px var(--c);
        transform: scale(1.02);
      }
      .basket {
        margin: 14px auto;
        max-width: 760px;
        min-height: 170px;
        background: linear-gradient(#fff, #fff7e0);
        border: 5px solid #f4b860;
        padding: 14px;
        position: relative;
      }
      .count {
        position: absolute;
        right: 14px;
        top: 10px;
        background: var(--c);
        color: #fff;
        border-radius: 20px;
        padding: 4px 16px;
        font-size: 2rem;
        font-weight: 900;
        text-align: center;
        line-height: 1.1;
      }
      .count small {
        display: block;
        font-size: 0.65rem;
        font-weight: 700;
      }

      /* Peças arrastáveis */
      /* touch-action:none é ESSENCIAL: avisa o navegador do celular para não rolar a página quando o dedo arrasta uma peça. */
      .tok {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
        transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1);
        animation: popin 0.3s;
      }

      /* Enquanto arrasta: sem transição (acompanha o dedo na hora), z-index alto (fica por cima de tudo) e sombra para parecer que "levantou". */
      .tok.drag {
        transition: none;
        z-index: 1000;
        position: relative;
        cursor: grabbing;
        filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.25));
      }
      .tok.emo {
        font-size: 2.5rem;
        line-height: 1;
        padding: 2px;
      }
      .tok.sm.emo {
        font-size: 1.9rem;
      }
      .tok.u.cube {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(#ffb36b, #ff8a3d);
        border: 3px solid #e8731f;
      }
      .tok.t {
        display: flex;
        gap: 2px;
        background: #4dabf7;
        padding: 4px;
        border-radius: 10px;
        border: 3px solid #1c7ed6;
      }

      /* A barra de 10 é um <div> com 10 <i> dentro, cada um é um quadradinho azul. Desenhar com CSS evita precisar de imagens! */
      .tok.t i {
        width: 11px;
        height: 26px;
        border-radius: 4px;
        background: #a5d8ff;
        display: block;
      }
      .tok:not(.drag):hover {
        transform: translateY(-3px);
      }

      /* Monstrinho, bandejas, amigos */
      .monster {
        margin: 12px auto;
        max-width: 380px;
        text-align: center;
        padding: 10px;
        background: #f1ecff;
        border: 5px solid var(--c);
      }
      .monster .face {
        font-size: 5rem;
        display: inline-block;
        animation: floaty 2.5s ease-in-out infinite;
      }
      .monster.munch .face {
        animation: munch 0.4s;
      }
      .plates,
      .friends {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 16px 0;
      }
      .plate {
        flex: 0 0 180px;
        background: #fff;
        border: 5px solid var(--c);
        padding: 12px 8px 8px;
        min-height: 140px;
        position: relative;
      }
      .plate .badge {
        position: absolute;
        top: -16px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--c);
        color: #fff;
        border-radius: 16px;
        padding: 0 14px;
        font-weight: 900;
      }
      .plate.full {
        background: #effff6;
      }
      .plate.glow {
        animation: glow 0.8s;
      }
      .friend {
        flex: 0 0 200px;
        background: #fff;
        border: 5px solid var(--c);
        padding: 8px;
        min-height: 170px;
        text-align: center;
      }
      .fav {
        font-size: 3rem;
        line-height: 1.1;
      }
      .fname {
        font-weight: 800;
        margin-bottom: 4px;
      }
      .fname b {
        background: var(--c);
        color: #fff;
        border-radius: 12px;
        padding: 0 10px;
      }
      .friend .pile {
        justify-content: center;
      }

      /* Resposta */
      .ask {
        max-width: 560px;
        margin: 16px auto 0;
        text-align: center;
      }
      .question {
        font-size: 1.6rem;
        font-weight: 900;
        margin-bottom: 8px;
      }
      .kp {
        display: inline-block;
        background: #fff;
        padding: 14px;
        border-radius: 26px;
        box-shadow: var(--shadow);
      }
      .kpdisp {
        font-size: 3rem;
        font-weight: 900;
        min-width: 200px;
        border-radius: 16px;
        background: #f3f6ff;
        margin-bottom: 10px;
        padding: 2px 10px;
        color: var(--c);
      }

      /* CSS GRID: 3 colunas de 78px formam o teclado numérico. repeat(3, 78px) é o mesmo que escrever 78px três vezes. */
      .kpgrid {
        display: grid;
        grid-template-columns: repeat(3, 78px);
        gap: 10px;
        justify-content: center;
      }
      .kpkey {
        height: 64px;
        border-radius: 18px;
        background: #eef1fb;
        font-size: 1.8rem;
        font-weight: 900;
        box-shadow: 0 5px 0 #d3d9ee;
      }
      .kpkey:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #d3d9ee;
      }
      .kpkey.ok {
        background: var(--c);
        color: #fff;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
      }
      .shake {
        animation: shake 0.4s;
      }
      .bigbtn {
        background: var(--c, #3a86ff);
        color: #fff;
        font-weight: 900;
        padding: 14px 26px;
        border-radius: 999px;
        font-size: 1.25rem;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
        margin: 6px;
      }
      .bigbtn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      }
      .bigbtn.ghost {
        background: #fff;
        color: var(--ink);
        border: 3px solid #d3d9ee;
        box-shadow: 0 5px 0 #d3d9ee;
      }
      .bigbtn.alt {
        background: #2ecc71;
      }
      .tools {
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .tool {
        background: #fff;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 800;
        box-shadow: 0 4px 0 #d3d9ee;
        border: 3px solid #e6eaf7;
      }
      .arrbox {
        margin: 12px auto;
        background: #fff;
        border-radius: 20px;
        padding: 10px 16px;
        display: inline-block;
        box-shadow: var(--shadow);
      }
      .arrcap {
        font-weight: 800;
        color: var(--c);
      }
      .arr {
        display: inline-grid;
        gap: 6px;
        margin: 8px;
      }
      .arr i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--c);
        animation: popin 0.4s backwards;
      }

      /* Tabuada, balões, pausa */
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 8px 0;
      }
      .chip {
        background: #eef1f9;
        border-radius: 999px;
        padding: 8px 16px;
        font-weight: 800;
      }
      .chip.on {
        background: var(--c);
        color: #fff;
      }
      .gridwrap {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
      }
      #gc,
      #fc {
        border-radius: 20px;
        background: #fff;
        box-shadow: var(--shadow);
        touch-action: none;
      }
      .bigeq {
        font-size: 2.6rem;
        font-weight: 900;
        color: var(--c);
      }
      .exp {
        font-size: 1.15rem;
        font-weight: 700;
        line-height: 1.55;
        max-width: 400px;
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(120px, 200px));
        gap: 14px;
        justify-content: center;
        margin: 12px 0;
      }
      .choice {
        background: #fff;
        border-radius: 22px;
        padding: 16px;
        font-size: 2.2rem;
        font-weight: 900;
        box-shadow: 0 6px 0 #d3d9ee;
        border: 4px solid #e6eaf7;
      }
      .choice.right {
        background: #c9f7dc;
        border-color: #2ecc71;
      }
      .choice.dim {
        opacity: 0.3;
        pointer-events: none;
      }
      #bc {
        display: block;
        margin: 8px auto;
        border-radius: 24px;
        background: linear-gradient(#bfe4ff, #eaf8ff 70%, #c8f0c0);
        box-shadow: var(--shadow);
        touch-action: manipulation;
      }
      #pc {
        display: block;
        margin: 0 auto;
        border-radius: 28px;
        background: radial-gradient(#26324f, #141b30);
        touch-action: manipulation;
      }

      /* Área do material dourado: a continha em pé (esquerda) e o canvas 3D (direita). Em telas estreitas, quebram em duas linhas. */
      .ouroWrap {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: center;
      }
      .contaBox {
        flex: 0 0 330px;
        background: #fff;
        border-radius: 24px;
        padding: 14px;
        box-shadow: var(--shadow);
      }

      /* @keyframes descreve uma animação por etapas (from → to). Depois é só usar "animation: popin .3s" em qualquer elemento. */

      /* Modo calmo: sem animações contínuas */
      /* O modo calmo (botão nos Ajustes) coloca a classe "calm" no <body>; esta regra desliga TODAS as animações. Ótimo exemplo de CSS controlado por JavaScript. */
      body.calm * {

      /* Media query de ACESSIBILIDADE: se o sistema do usuário pede "menos movimento", respeitamos automaticamente. */
      @media (prefers-reduced-motion: reduce) {

  </head>
  <body>
    <!--
      DUAS CAMADAS DE CANVAS cobrem a tela inteira (ver CSS #bg e #fx):
        • #bg → símbolos de matemática flutuando ao fundo (fica ATRÁS de tudo)
        • #fx → confete de comemoração (fica NA FRENTE, mas não bloqueia cliques)
      <canvas> é uma "folha de desenho": o JavaScript pinta nela pixel por pixel.
      aria-hidden="true" avisa leitores de tela que é só enfeite.
    -->
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>

    <!--
      Container principal. O resto do jogo é montado AQUI DENTRO pelo JavaScript:
      cabeçalho (mascote + balão), abas e a "tela" (stage) da atividade atual.
    -->
    <div id="app">
      <header id="top">
        <!--
          O Zeca é desenhado com código neste canvas (veja drawMascot no script). O aria-label descreve a imagem para quem usa leitor de tela.
        -->
        <canvas id="mascot" width="300" height="300" aria-label="Zeca, o robô amigo"></canvas>

        <!--
          Balão de fala. role="status" + aria-live="polite" fazem leitores de tela anunciarem cada mensagem nova sem interromper.
        -->
        <div id="bubble" role="status" aria-live="polite">
          <span id="bubbleText">Oi! Eu sou o Zeca!</span>
          <button class="mini" id="speakBtn" title="Ouvir de novo" aria-label="Ouvir de novo">🔊</button>
        </div>
        <div id="hud">
          <div class="pill">⭐ <b id="starCount">0</b> estrelas</div>
          <button class="pill" id="musicBtn" aria-pressed="false">🎵 Música: desligada</button>
          <button class="pill" id="settingsBtn">⚙️ Ajustes</button>
          <button class="pill" id="calmBtn">🌙 Preciso de uma pausa</button>
        </div>
      </header>

      <!--
        Vazio de propósito! As abas (Início, Somar, ...) são criadas pelo JavaScript
        na função init(), a partir do objeto MODS. Assim, para criar uma aba nova
        basta cadastrar uma atividade em MODS.
      -->
      <nav id="tabs" aria-label="Atividades"></nav>

      <!--
        A "tela" da atividade. A função go(id) apaga o conteúdo daqui e desenha a atividade escolhida.
      -->
      <main id="stage"></main>
    </div>

    <!--
      <dialog> é um elemento nativo para janelinhas (modais). O JavaScript chama
      showModal() para abrir e close() para fechar. Ele escurece o fundo sozinho.
    -->
    <dialog id="settings"></dialog>
    <dialog id="roundDlg"></dialog>

    <!--
      Daqui para baixo é JavaScript: o "cérebro" do jogo.
    -->
    <script>
      "use strict";
      //
      // MAPA DO SCRIPT (de cima para baixo)
      //   1. Utilidades ......... funções pequenas e dados que todo o resto usa
      //   2. Estado salvo ....... guarda estrelas, nome e ajustes no navegador
      //   3. Som, Música e Voz .. sons e valsa criados por código; leitura em voz alta
      //   4. Mascote e efeitos .. desenhos no Canvas (Zeca, confete, fundo)
      //   5. Roteamento ......... troca de abas, laços de animação, recompensas
      //   6. Teclado e arrastar . componentes reutilizáveis pelas atividades
      //   7. Atividades ......... Somar, Subtrair, Multiplicar, Dividir, 3D, Tabuada...
      //   8. Início do app ...... init() liga tudo quando a página abre
      //
      // DICA: "use strict" (acima) liga o modo estrito: erros bobos, como usar uma
      // variável não declarada, viram avisos claros em vez de passarem batido.
      //
      /* ===================== Utilidades ===================== */
      // Aqui ficam "ferramentas" pequenas. Repare no padrão: funções curtas, com nome
      // claro, que fazem UMA coisa. Isso se chama reaproveitar código (não repetir).
      // Atalho: $("#stage") em vez de document.querySelector("#stage"). O 2º parâmetro (r = document) é um VALOR PADRÃO: se não passarem nada, busca na página toda.
      const $ = (s, r = document) => r.querySelector(s);

      // Cria um elemento HTML: el("div", "card", "<b>Oi</b>").
      // document.createElement cria; className define as classes CSS; innerHTML define o conteúdo.
      const el = (tag, cls, html) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
      };

      // Número inteiro aleatório entre a e b (incluindo os dois). Math.random() dá um decimal de 0 até quase 1; multiplicamos e arredondamos para baixo com Math.floor.
      const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

      // Sorteia um item de uma lista: pick(["🍎","🍌"]).
      const pick = (a) => a[Math.floor(Math.random() * a.length)];

      // Embaralha uma lista (algoritmo de Fisher-Yates): percorre de trás para frente trocando cada item com outro sorteado. a.slice() faz uma CÓPIA para não estragar a lista original.
      const shuffle = (a) => {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = rnd(0, i);
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };

      // Pausa assíncrona: "await sleep(500)" espera meio segundo SEM travar a página.
      // Promise = "promessa de um resultado no futuro"; setTimeout chama resolve depois do tempo.
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // SEGURANÇA: troca caracteres especiais (< > & ") por versões inofensivas. Sem isso, um nome como <b>oi</b> viraria HTML de verdade ao ser colocado na página.
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );

      // Dados em listas e objetos: para mudar textos, cores ou emojis, não precisa mexer na lógica do jogo, só nestas listas.
      const COLORS = ["#ff8a5b", "#8b6cff", "#16b8a6", "#ff5d8f", "#ffb703", "#3a86ff", "#2ecc71"];
      const FOODS = ["🍎", "🍓", "🍪", "🍌", "🍩", "🍇", "🍊", "🧁"];
      const FRIENDS = [
        ["🐶", "Totó"],
        ["🐱", "Mimi"],
        ["🐰", "Pipoca"],
        ["🐻", "Bento"],
        ["🦊", "Raposo"],
        ["🐼", "Panda"],
      ];
      const PRAISE = [
        "Isso! Você mandou muito bem!",
        "Perfeito! Que cérebro incrível!",
        "Acertou! Estou orgulhoso!",
        "Uhuul! Mais uma estrela!",
        "Show! Você pegou o jeito!",
        "Muito bem! Calma e firmeza, né?",
      ];
      const AGAIN = [
        "Nova missão! Respire e vamos lá.",
        "Pronto para a próxima? Vamos nessa!",
        "Mais uma aventura começando!",
      ];

      // OBJETO usado como DICIONÁRIO: INTRO.soma devolve a frase de abertura da atividade "soma". A chave (soma) busca o valor (o texto).
      const INTRO = {
        soma: "Vamos somar! Leve as peças para a cesta e depois digite o total.",
        sub: "Vamos subtrair! Alimente o Gulosinho e veja o que sobra.",
        mult: "Multiplicar é juntar grupos iguais! Coloque a mesma quantidade em cada bandeja.",
        div: "Dividir é repartir igualzinho! Dê as peças para cada amigo.",
        parque:
          "Bem-vindo ao Parque Lógico! Monte cartões para programar o robô. Clique nele para conhecer o corpo dele.",
        ouro: "Vamos armar continhas com o material dourado! Você pode girar as peças com o dedo ou o mouse.",
        tab: "Aqui você descobre os segredos da tabuada. Escolha uma aba!",
        bal: "Estoure o balão com a resposta certa. Sem pressa e sem perder pontos!",
        pausa: "Vamos respirar juntos. Siga o círculo com os olhos.",
      };
      const ACH = [
        [10, "🎉", "Chapéu de festa"],
        [25, "👑", "Coroa"],
        [50, "😎", "Óculos escuros"],
        [100, "🦸", "Capa de herói"],
      ];

      // Plano do dia: lista de listas, uma para cada dia da semana (0 = domingo ... 6 = sábado). Usamos new Date().getDay() para escolher a de hoje.
      const PLANS = [
        ["soma", "pausa", "bal"],
        ["soma", "pausa", "mult"],
        ["sub", "pausa", "div"],
        ["soma", "pausa", "tab"],
        ["mult", "pausa", "bal"],
        ["div", "pausa", "sub"],
        ["tab", "pausa", "bal"],
      ];

      /* ===================== Estado salvo ===================== */
      // ESTADO = tudo que o jogo precisa lembrar. Guardamos em UM objeto (S) e o
      // salvamos no localStorage: um "caderninho" do navegador que sobrevive quando
      // a página é fechada. Só aceita TEXTO, por isso usamos JSON.stringify (objeto →
      // texto) para salvar e JSON.parse (texto → objeto) para ler.
      // Nome da "gaveta" do localStorage onde guardamos o progresso. Mudar o número da versão (v1) começaria um progresso novo.
      const KEY = "mundo-dos-numeros-v1";

      // O objeto de estado. Valores iniciais = o que um jogador novo vê.
      const S = {
        stars: 0,
        name: "",
        sound: true,
        voice: false,
        calm: false,
        fs: 20,
        levels: {},
        dayKey: "",
        doneToday: {},
        tabSub: "grade",
        frogN: 2,
        trainT: 0,
        trainInv: false,
        balOps: ["+"],
        balSlow: true,
        music: false, // música de parque ligada? (começa desligada)
        musicVol: 0.06, // volume da música (0 a 0,15)
        ouroOp: "mix",
      };

      // Lê o progresso salvo. try/catch protege: se o navegador bloquear o localStorage (aba anônima, por ex.), o jogo continua funcionando sem salvar.
      function load() {
        let raw = null;
        try {
          raw = localStorage.getItem(KEY);
        } catch (e) {}
        if (raw) {
          try {
            Object.assign(S, JSON.parse(raw));
          } catch (e) {}
        } else if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) S.calm = true;
      }

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {}
      }

      // Chave do dia no formato "2026-10-10". Serve para saber se o plano de hoje já foi feito (zera a cada dia).
      function today() {
        const d = new Date();
        return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      }

      function isDone(id) {
        if (S.dayKey !== today()) {
          S.dayKey = today();
          S.doneToday = {};
        }
        return !!S.doneToday[id];
      }

      function markDone(id) {
        isDone(id);
        S.doneToday[id] = true;
        save();
      }

      // Aplica os ajustes na tela: classList.toggle liga/desliga a classe "calm" no <body> e style.fontSize muda o tamanho base das letras.
      function applyPrefs() {
        document.body.classList.toggle("calm", !!S.calm);
        document.documentElement.style.fontSize = S.fs + "px";
      }

      /* ===================== Som (WebAudio, sem arquivos) ===================== */
      // Todos os sons são SINTETIZADOS por código com a Web Audio API: nada de arquivos
      // .mp3! Um som é uma onda (oscillator) que passa por um controle de volume
      // (gain) até chegar nos alto-falantes (destination).
      // AudioContext = a "mesa de som". Só pode ser criado/ativado depois de um clique do usuário (regra dos navegadores contra sons surpresa), por isso é criado sob demanda em ac().
      let AC = null;

      // audio(): devolve a "mesa de som", criando-a na primeira vez. Serve para a música
      // e para os efeitos. Se o navegador não suportar, devolve null e o jogo segue mudo.
      function audio() {
        try {
          if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
          if (AC.state === "suspended") AC.resume();
        } catch (e) {
          return null;
        }
        return AC;
      }

      // ac(): igual a audio(), mas só quando os EFEITOS SONOROS estão ligados (S.sound).
      // Assim a criança pode ouvir só a música, só os efeitos, os dois ou nenhum.
      function ac() {
        return S.sound ? audio() : null;
      }

      // Toca UMA nota.
      //   f = frequência em Hz (quanto maior, mais agudo)   d = duração em segundos
      //   type = formato da onda: "sine" suave, "triangle" macia, "square" áspera
      //   vol = volume   delay = espera antes de tocar   slide = quanto a nota sobe/desce
      // O volume nasce quase em 0, sobe rápido e desce suave (envelope): sem isso
      // ouviríamos "cliques" feios no começo e no fim da nota.
      function tone(f, d = 0.15, type = "sine", vol = 0.15, delay = 0, slide = 0) {
        const a = ac();
        if (!a) return;
        const t = a.currentTime + delay;
        const o = a.createOscillator(),
          g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g);
        g.connect(a.destination);
        o.start(t);
        o.stop(t + d + 0.05);
      }

      // Converte "semitons acima do Dó central" em frequência. Cada semitom multiplica a frequência por 2^(1/12): é a matemática da música!
      const NT = (i) => 261.63 * Math.pow(2, i / 12);

      // Semitons da escala de Dó maior (dó, ré, mi, fá, sol, lá, si...). Usada para os sons de contagem subirem "cantando".
      const SC = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19];

      // Efeitos sonoros do jogo. Os sons de ERRO são baixos e suaves de propósito (nada de buzina). Repare nos acordes: SFX.good toca 4 notas em sequência (um arpejo).
      const SFX = {
        click() {
          tone(NT(12), 0.06, "triangle", 0.07);
        },
        pick() {
          tone(NT(7), 0.08, "sine", 0.1);
        },
        count(i) {
          tone(NT(SC[i % 12]), 0.16, "triangle", 0.16);
        },
        good() {
          [0, 4, 7, 12].forEach((s, i) => tone(NT(s + 12), 0.18, "triangle", 0.14, i * 0.09));
        },
        star() {
          [12, 16, 19, 24].forEach((s, i) => tone(NT(s), 0.2, "sine", 0.1, i * 0.08));
        },
        oops() {
          tone(NT(5), 0.18, "sine", 0.07);
          tone(NT(0), 0.26, "sine", 0.07, 0.15);
        },
        munch() {
          tone(220, 0.09, "square", 0.05, 0, -100);
          tone(170, 0.09, "square", 0.05, 0.09, -70);
        },
        pop() {
          tone(520, 0.1, "sine", 0.18, 0, -300);
        },
        softpop() {
          tone(700, 0.12, "sine", 0.07, 0, -250);
        },
      };

      /* ===================== Música de parque (liga/desliga) ===================== */
      // Uma valsa de carrossel feita 100% por código. Aprenda aqui duas ideias importantes:
      //   1) ESCALONAR NO RELÓGIO DO ÁUDIO: setInterval roda a cada ~25 ms e "olha à frente"
      //      200 ms, agendando as próximas notas com o relógio preciso do áudio
      //      (a.currentTime). Se tocássemos direto no setInterval, o ritmo tremeria.
      //   2) MÚSICA = DADOS: a melodia é só uma lista de números (semitons acima do Dó
      //      central; null = silêncio). Mude os números e você muda a música!
      const VALSA = {
        // 8 compassos de 3 tempos = 24 notas. Cada número é uma nota (ver NT lá em cima).
        melodia: [4, 7, 4, 12, 11, 7, 9, 5, 9, 7, null, null, 4, 7, 4, 12, 14, 16, 14, 11, 7, 12, null, null],
        // Acorde de cada compasso (C = Dó, F = Fá, G = Sol), em semitons.
        acorde: { C: [0, 4, 7], F: [5, 9, 12], G: [7, 11, 14] },
        harmonia: ["C", "C", "F", "C", "C", "C", "G", "C"],
      };
      // Estado do tocador: nó de volume, o temporizador, o instante da próxima nota e o tempo atual.
      const MUS = { gain: null, timer: null, proximo: 0, tempo: 0 };

      // Volume final: no modo calmo a música fica ainda mais baixinha.
      const volumeMusica = () => (S.calm ? 0.6 : 1) * (S.musicVol || 0.06);

      // Toca UMA nota da música: oscilador -> filtro (deixa o som macio) -> envelope -> volume da música.
      function notaMusica(freq, t, dur, tipo, vol) {
        const a = audio();
        if (!a || !MUS.gain) return;
        const o = a.createOscillator(),
          g = a.createGain(),
          f = a.createBiquadFilter();
        o.type = tipo;
        o.frequency.value = freq;
        f.type = "lowpass"; // corta os agudos ásperos
        f.frequency.value = 1800;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02); // sobe rápido...
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur); // ...e desce suave
        o.connect(f);
        f.connect(g);
        g.connect(MUS.gain);
        o.start(t);
        o.stop(t + dur + 0.05);
      }

      // Chamada a cada 25 ms: agenda todas as notas que cairão nos próximos 200 ms.
      function musicaAgendar() {
        const a = audio();
        if (!a) return;
        const spb = 60 / (S.calm ? 84 : 104); // segundos por tempo (menor andamento no modo calmo)
        while (MUS.proximo < a.currentTime + 0.2) {
          const b = MUS.tempo % 24, // posição na música (0 a 23)
            compasso = Math.floor(b / 3),
            pos = b % 3, // 0 = primeiro tempo do compasso
            t = MUS.proximo;
          const m = VALSA.melodia[b];
          if (m != null) notaMusica(NT(m), t, spb * 0.9, "triangle", 0.5); // melodia
          const acorde = VALSA.acorde[VALSA.harmonia[compasso]];
          if (pos === 0)
            notaMusica(NT(acorde[0] - 12), t, spb * 0.8, "sine", 0.7); // "oom" (grave)
          else acorde.forEach((x) => notaMusica(NT(x), t, spb * 0.3, "square", 0.08)); // "pá" (curtinho)
          MUS.proximo += spb;
          MUS.tempo++;
        }
      }

      // Liga a música (com fade de entrada, para não "estourar" no ouvido).
      function musicaIniciar() {
        if (!S.music || MUS.timer) return;
        const a = audio();
        if (!a) return;
        if (!MUS.gain) {
          MUS.gain = a.createGain();
          MUS.gain.gain.value = 0.0001;
          MUS.gain.connect(a.destination);
        }
        MUS.gain.gain.cancelScheduledValues(a.currentTime);
        MUS.gain.gain.setTargetAtTime(volumeMusica(), a.currentTime, 0.25);
        MUS.proximo = a.currentTime + 0.1;
        MUS.tempo = 0;
        MUS.timer = setInterval(musicaAgendar, 25);
      }

      // Desliga a música (com fade de saída).
      function musicaParar() {
        if (!MUS.timer) return;
        clearInterval(MUS.timer);
        MUS.timer = null;
        if (AC && MUS.gain) {
          MUS.gain.gain.cancelScheduledValues(AC.currentTime);
          MUS.gain.gain.setTargetAtTime(0.0001, AC.currentTime, 0.15);
        }
      }

      // Faz a música obedecer ao interruptor (S.music) e atualiza o texto do botão do cabeçalho.
      function musicaAplicar() {
        if (S.music) musicaIniciar();
        else musicaParar();
        const b = $("#musicBtn");
        if (b) {
          b.textContent = S.music ? "🎵 Música: ligada" : "🎵 Música: desligada";
          b.setAttribute("aria-pressed", S.music);
        }
      }

      // Ajusta o volume ao vivo (usado pelo controle deslizante e pelo modo calmo).
      function musicaVolume() {
        if (AC && MUS.gain && MUS.timer) MUS.gain.gain.setTargetAtTime(volumeMusica(), AC.currentTime, 0.1);
      }

      // Boa prática: música para quando a aba fica escondida e volta quando a pessoa retorna.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) musicaParar();
        else if (S.music) musicaIniciar();
      });

      /* ===================== Voz ===================== */
      // Leitura em voz alta usando a voz do próprio aparelho (SpeechSynthesis). Não envia nada pela internet.
      let lastSaid = "";

      // Antes de falar, trocamos símbolos por palavras (× → "vezes") e removemos emojis com uma expressão regular (regex): \p{L} = qualquer letra, \p{N} = qualquer número.
      function speak(t) {
        if (!("speechSynthesis" in window)) return;
        try {
          speechSynthesis.cancel();
          t = t
            .replace(/×/g, " vezes ")
            .replace(/÷/g, " dividido por ")
            .replace(/\+/g, " mais ")
            .replace(/[−–]/g, " menos ")
            .replace(/=/g, " é igual a ");
          const u = new SpeechSynthesisUtterance(t.replace(/[^\p{L}\p{N}\s.,!?]/gu, " "));
          u.lang = "pt-BR";
          u.rate = 0.95;
          u.pitch = 1.15;
          speechSynthesis.speak(u);
        } catch (e) {}
      }

      /* ===================== Zeca, o mascote (Canvas) ===================== */
      // CANVAS 2D: o contexto (getContext("2d")) é o nosso "pincel". Comandos que usamos:
      //   fillStyle / strokeStyle ... cor de preenchimento / de contorno
      //   beginPath() + arc/moveTo/lineTo ... descrevem uma forma; fill()/stroke() pintam
      //   translate / rotate / scale ........ movem, giram e ampliam o "papel"
      //   save() / restore() ................ guardam / devolvem o estado do pincel
      // O desenho é feito do fundo para a frente: o que é pintado depois cobre o anterior.
      const mc = $("#mascot"),
        mg = mc.getContext("2d");

      // Estado do humor do Zeca: "happy", "think" ou "cheer" (comemorando). "until" é até que instante o humor vale antes de voltar ao normal.
      const M = { mood: "happy", until: 0, blinkT: -9, blinkNext: 2 };

      // Retângulo com cantos arredondados. O canvas não tem isso pronto, então montamos com arcTo (curvas nos cantos).
      function rr(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }

      // Desenha um braço: save() guarda a posição, translate/rotate giram em torno do ombro, e restore() desfaz tudo para o próximo desenho não ser afetado.
      function arm(g, x, y, a) {
        g.save();
        g.translate(x, y);
        g.rotate(a);
        g.fillStyle = "#35c9b7";
        g.strokeStyle = "#1e9c8d";
        g.lineWidth = 5;
        rr(g, -9, -6, 18, 52, 9);
        g.fill();
        g.stroke();
        g.fillStyle = "#ffd166";
        g.beginPath();
        g.arc(0, 52, 13, 0, 7);
        g.fill();
        g.stroke();
        g.restore();
      }

      // Desenha UM quadro do Zeca. Esta função roda ~60 vezes por segundo (ver mloop),
      // e cada vez apaga tudo e desenha de novo, com pequenas diferenças: é assim que
      // nasce uma animação!
      function drawMascot(now) {
        const g = mg,
          s = mc.width / 260,
          t = now / 1000;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, mc.width, mc.height);
        g.scale(s, s);
        if (M.mood !== "happy" && now > M.until) M.mood = "happy";
        const cheer = M.mood === "cheer",
          think = M.mood === "think",
          calm = S.calm;
        if (t > M.blinkNext) {
          M.blinkT = t;
          M.blinkNext = t + 2 + Math.random() * 3;
        }

        // Piscada: uma função "triângulo" que vai de 0 a 1 e volta em 0,16s. Multiplicada pela altura dos olhos, ela os fecha rapidinho. A cada 2 a 5 segundos sorteamos a próxima.
        const bl = Math.max(0, 1 - Math.abs(t - M.blinkT - 0.08) / 0.08);

        // "bob" = sobe-e-desce do corpo. Math.sin(t) oscila suavemente entre -1 e 1, perfeito para movimentos de "respirar". Quando comemora, usamos |sin| para pulinhos.
        const bob = cheer ? -Math.abs(Math.sin(t * 8)) * (calm ? 5 : 18) : Math.sin(t * 2) * (calm ? 1.5 : 5);
        g.fillStyle = "rgba(0,0,0,.12)";
        g.beginPath();
        g.ellipse(130, 242, 68 + bob * 0.6, 9, 0, 0, 7);
        g.fill();

        // A partir daqui tudo é desenhado deslocado "bob" pixels na vertical, então o corpo inteiro sobe e desce junto. A sombra foi desenhada ANTES, por isso fica parada no chão.
        g.translate(0, bob);
        g.lineCap = "round";
        if (S.stars >= 100) {
          g.fillStyle = "#e63946";
          g.beginPath();
          g.moveTo(66, 110);
          g.lineTo(26 + Math.sin(t * 3) * 6, 232);
          g.lineTo(234 - Math.sin(t * 3) * 6, 232);
          g.lineTo(194, 110);
          g.closePath();
          g.fill();
        }
        const ax = 130 + Math.sin(t * 3) * 4;
        g.strokeStyle = "#1e9c8d";
        g.lineWidth = 6;
        g.beginPath();
        g.moveTo(130, 56);
        g.lineTo(ax, 28);
        g.stroke();
        g.fillStyle = cheer ? "#ffd166" : "#ff5d8f";
        g.beginPath();
        g.arc(ax, 20, 10 + (cheer ? 3 * Math.sin(t * 14) : 0), 0, 7);
        g.fill();
        const wave = cheer ? 2.5 + Math.sin(t * 12) * 0.35 : 0.15 + Math.sin(t * 2) * 0.08;
        arm(g, 52, 150, wave);
        arm(g, 208, 150, -wave);
        const gr = g.createLinearGradient(0, 52, 0, 220);
        gr.addColorStop(0, "#4be0cc");
        gr.addColorStop(1, "#25a999");
        g.fillStyle = gr;
        g.strokeStyle = "#1e9c8d";
        g.lineWidth = 6;
        rr(g, 48, 54, 164, 164, 62);
        g.fill();
        g.stroke();
        g.fillStyle = "#16324f";
        rr(g, 70, 80, 120, 92, 34);
        g.fill();
        const ex = think ? 5 : 0,
          ey = think ? -5 : 0;
        [104, 156].forEach((x) => {
          if (cheer) {
            g.strokeStyle = "#7ff3ff";
            g.lineWidth = 7;
            g.beginPath();
            g.arc(x, 124, 11, Math.PI * 1.1, Math.PI * 1.9);
            g.stroke();
          } else {
            g.fillStyle = "#7ff3ff";
            g.beginPath();
            g.ellipse(x + ex, 116 + ey, 12, Math.max(1.5, 15 * (1 - bl)), 0, 0, 7);
            g.fill();
          }
        });
        if (cheer) {
          g.fillStyle = "#ff8aa0";
          g.beginPath();
          g.arc(130, 142, 17, 0, Math.PI);
          g.closePath();
          g.fill();
        } else if (think) {
          g.fillStyle = "#7ff3ff";
          g.beginPath();
          g.arc(138, 150, 6, 0, 7);
          g.fill();
        } else {
          g.strokeStyle = "#7ff3ff";
          g.lineWidth = 6;
          g.beginPath();
          g.arc(130, 136, 18, 0.2, Math.PI - 0.2);
          g.stroke();
        }
        g.fillStyle = "rgba(255,138,160,.55)";
        [84, 176].forEach((x) => {
          g.beginPath();
          g.arc(x, 152, 8, 0, 7);
          g.fill();
        });
        ["#ff8a5b", "#8b6cff", "#16b8a6", "#ff5d8f"].forEach((c, i) => {
          g.fillStyle = c;
          g.beginPath();
          g.arc(96 + i * 23, 196, 8, 0, 7);
          g.fill();
        });
        if (S.stars >= 50) {
          g.fillStyle = "rgba(10,10,20,.9)";
          rr(g, 82, 98, 44, 30, 12);
          g.fill();
          rr(g, 134, 98, 44, 30, 12);
          g.fill();
          g.fillRect(124, 106, 12, 6);
          g.fillStyle = "rgba(255,255,255,.45)";
          g.fillRect(90, 104, 10, 5);
          g.fillRect(142, 104, 10, 5);
        }
        if (S.stars >= 25) {
          g.fillStyle = "#ffd166";
          g.strokeStyle = "#e0a100";
          g.lineWidth = 4;
          g.beginPath();
          g.moveTo(98, 58);
          g.lineTo(98, 34);
          g.lineTo(114, 48);
          g.lineTo(130, 28);
          g.lineTo(146, 48);
          g.lineTo(162, 34);
          g.lineTo(162, 58);
          g.closePath();
          g.fill();
          g.stroke();
        } else if (S.stars >= 10) {
          g.fillStyle = "#ff5d8f";
          g.strokeStyle = "#c93a6a";
          g.lineWidth = 4;
          g.beginPath();
          g.moveTo(142, 60);
          g.lineTo(186, 68);
          g.lineTo(168, 12);
          g.closePath();
          g.fill();
          g.stroke();
          g.fillStyle = "#ffd166";
          g.beginPath();
          g.arc(168, 12, 8, 0, 7);
          g.fill();
        }
      }

      // O LAÇO DE ANIMAÇÃO: requestAnimationFrame pede ao navegador "me chame de novo
      // antes de desenhar o próximo quadro". A função chama a si mesma e vira um ciclo.
      // O parêntese em volta + "()" no final executam a função imediatamente (IIFE).
      (function mloop(now) {
        drawMascot(now);
        requestAnimationFrame(mloop);
      })(performance.now());

      let lastBubble = null;

      // Faz o Zeca falar: troca o texto do balão, muda o humor e (se ligado) lê em voz alta.
      // O truque "void b.offsetWidth" força o navegador a recalcular o layout, para a
      // animação CSS "pop" REINICIAR mesmo quando a classe já estava lá.
      function say(text, mood = "happy") {
        lastSaid = text;
        $("#bubbleText").textContent = text;
        M.mood = mood;
        M.until = performance.now() + (mood === "cheer" ? 3500 : 4500);
        const b = $("#bubble");
        b.classList.remove("pop");
        void b.offsetWidth;
        b.classList.add("pop");
        if (S.voice) speak(text);
      }

      /* ===================== Confete e fundo ===================== */
      // Sistema de PARTÍCULAS: milhares de pontinhos, cada um com posição, velocidade e vida. Atualizamos todos a cada quadro (física simples) e desenhamos.
      const fx = $("#fx"),
        fctx = fx.getContext("2d"),
        bg = $("#bg"),
        bctx = bg.getContext("2d");
      let parts = [],
        fxOn = false,
        syms = [];

      // O canvas tem um tamanho em pixels (width/height) que precisa acompanhar a janela. Também sorteamos os símbolos do fundo, mais ou menos um por área da tela.
      function sizeCanvases() {
        fx.width = innerWidth;
        fx.height = innerHeight;
        bg.width = innerWidth;
        bg.height = innerHeight;
        syms = Array.from({ length: Math.round((innerWidth * innerHeight) / 42000) + 10 }, () => ({
          x: Math.random() * bg.width,
          y: Math.random() * bg.height,
          s: rnd(28, 70),
          v: 0.08 + Math.random() * 0.2,
          r: Math.random() * 6,
          vr: (Math.random() - 0.5) * 0.004,
          t: pick("+−×÷=0123456789".split("")),
          c: pick(COLORS),
        }));
      }

      // Fundo animado: cada símbolo sobe devagar (y diminui) e gira um pouquinho. Quando sai por cima, reaparece embaixo. No modo calmo, ficam parados.
      function bgLoop() {
        bctx.clearRect(0, 0, bg.width, bg.height);
        for (const s of syms) {
          bctx.save();
          bctx.translate(s.x, s.y);
          bctx.rotate(s.r);
          bctx.globalAlpha = 0.11;
          bctx.fillStyle = s.c;
          bctx.font = `900 ${s.s}px "Trebuchet MS",sans-serif`;
          bctx.textAlign = "center";
          bctx.fillText(s.t, 0, 0);
          bctx.restore();
          if (!S.calm) {
            s.y -= s.v;
            s.r += s.vr;
            if (s.y < -80) s.y = bg.height + 80;
          }
        }
        requestAnimationFrame(bgLoop);
      }

      // Cria as partículas: sorteia velocidade (vx, vy), tamanho, cor e vida de cada uma. No modo calmo, poucas peças. Só liga o laço de animação se ele ainda não estiver rodando.
      function confetti(n = 100) {
        if (S.calm) n = Math.min(n, 18);
        const x = innerWidth / 2,
          y = innerHeight * 0.3;
        for (let i = 0; i < n; i++)
          parts.push({
            x: x + (Math.random() - 0.5) * 240,
            y,
            vx: (Math.random() - 0.5) * 16,
            vy: -Math.random() * 15 - 3,
            s: rnd(6, 12),
            r: Math.random() * 6,
            vr: (Math.random() - 0.5) * 0.4,
            c: pick(COLORS),
            life: rnd(80, 140),
            sh: rnd(0, 1),
          });
        if (!fxOn) {
          fxOn = true;
          requestAnimationFrame(fxLoop);
        }
      }

      // Física do confete a cada quadro:
      //   vy += gravidade (cai cada vez mais rápido)    x += vx, y += vy (movimento)
      //   vx *= 0.985 (atrito do ar)    life-- (vai sumindo)
      // Quando acabam as partículas, o laço PARA (não gasta bateria à toa).
      function fxLoop() {
        fctx.clearRect(0, 0, fx.width, fx.height);
        parts = parts.filter((p) => p.life > 0);
        for (const p of parts) {
          p.vy += 0.45;
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.985;
          p.r += p.vr;
          p.life--;
          fctx.save();
          fctx.globalAlpha = Math.min(1, p.life / 30);
          fctx.translate(p.x, p.y);
          fctx.rotate(p.r);
          fctx.fillStyle = p.c;
          if (p.sh) fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
          else {
            fctx.beginPath();
            fctx.arc(0, 0, p.s / 2, 0, 7);
            fctx.fill();
          }
          fctx.restore();
        }
        if (parts.length) requestAnimationFrame(fxLoop);
        else {
          fxOn = false;
          fctx.clearRect(0, 0, fx.width, fx.height);
        }
      }

      /* ===================== Roteamento e laços de animação ===================== */
      // "Roteamento" = decidir qual tela mostrar. Nosso mini-roteador é a função go().
      // Como cada atividade pode iniciar animações próprias, guardamos tudo que precisa
      // ser desligado ao trocar de aba.
      // Variáveis de controle do app:
      //   SID ........ "número da tela atual". Aumenta a cada go(). Códigos assíncronos
      //                (que esperam um tempo) guardam o SID de quando começaram e
      //                desistem se ele mudou: assim nada acontece "na tela errada".
      //   loops ...... lista de animações em andamento (para parar todas ao sair)
      //   onResize ... função da atividade atual para reagir ao redimensionar a janela
      //   activeKeypad teclado numérico em uso (para aceitar o teclado físico)
      let SID = 0,
        loops = [],
        onResize = null,
        activeKeypad = null;
      const R = {},
        introduced = new Set();

      // Desliga todas as animações da atividade anterior (cada uma tem uma chave "on" que o laço consulta).
      function cancelLoops() {
        loops.forEach((l) => (l.on = false));
        loops = [];
      }

      // Ajudante para animações: chama fn(dt, now) a cada quadro, onde dt = segundos
      // desde o quadro anterior. Usar dt (e não "1 passo por quadro") faz a animação ter
      // a MESMA velocidade em computadores rápidos e lentos. Math.min(.05, ...) evita
      // um "salto" gigante se a aba ficou escondida por um tempo.
      function loop(fn) {
        const l = { on: true, last: performance.now() };
        loops.push(l);
        const f = (now) => {
          if (!l.on) return;
          const dt = Math.min(0.05, (now - l.last) / 1000);
          l.last = now;
          fn(dt, now);
          requestAnimationFrame(f);
        };
        requestAnimationFrame(f);
        return l;
      }

      // O CATÁLOGO de atividades. Cada item tem nome, ícone, cor e a função "render" que
      // desenha a atividade. Para criar uma atividade nova: escreva uma função
      // renderMinhaAtividade(stage) e cadastre uma linha aqui!
      const MODS = {
        home: { id: "home", name: "Início", icon: "🏠", color: "var(--home)", render: renderHome },
        soma: {
          id: "soma",
          name: "Somar",
          icon: "➕",
          color: "var(--soma)",
          title: "Fábrica de Somar",
          desc: "Junte grupos na cesta e descubra o total.",
          render: renderSoma,
        },
        sub: {
          id: "sub",
          name: "Subtrair",
          icon: "➖",
          color: "var(--sub)",
          title: "O Gulosinho",
          desc: "Alimente o monstrinho e veja o que sobra.",
          render: renderSub,
        },
        mult: {
          id: "mult",
          name: "Multiplicar",
          icon: "✖️",
          color: "var(--mult)",
          title: "Bandejas Mágicas",
          desc: "Monte grupos iguais e veja a multiplicação.",
          render: renderMult,
        },
        div: {
          id: "div",
          name: "Dividir",
          icon: "➗",
          color: "var(--div)",
          title: "Hora do Lanche",
          desc: "Reparta igualzinho entre os amigos.",
          render: renderDiv,
        },
        parque: {
          id: "parque",
          name: "Parque",
          icon: "🎡",
          color: "var(--parque)",
          title: "Parque Lógico",
          desc: "Programe um robô num parque 3D: variáveis, se e enquanto.",
          render: renderParque,
        },
        ouro: {
          id: "ouro",
          name: "Continhas 3D",
          icon: "🧊",
          color: "var(--ouro)",
          title: "Continhas com Material Dourado",
          desc: "Cubinhos, barras e placas em 3D para armar contas.",
          render: renderOuro,
        },
        tab: {
          id: "tab",
          name: "Tabuada",
          icon: "📊",
          color: "var(--tab)",
          title: "Laboratório da Tabuada",
          desc: "Grade mágica, pulos do sapo e treino.",
          render: renderTab,
        },
        bal: {
          id: "bal",
          name: "Balões",
          icon: "🎈",
          color: "var(--bal)",
          title: "Estoura-Balões",
          desc: "Estoure o balão com a resposta certa.",
          render: renderBal,
        },
        pausa: {
          id: "pausa",
          name: "Pausa",
          icon: "🌙",
          color: "var(--pausa)",
          title: "Cantinho Calmo",
          desc: "Respire fundo e descanse um pouquinho.",
          render: renderPausa,
        },
      };
      const stage = $("#stage");

      // O roteador. Passos: (1) aumenta o SID e desliga animações antigas, (2) marca a
      // aba ativa, (3) limpa a tela, (4) chama o render da atividade escolhida.
      function go(id) {
        SID++;
        S.cur = id;
        cancelLoops();
        activeKeypad = null;
        onResize = null;
        try {
          if ("speechSynthesis" in window) speechSynthesis.cancel();
        } catch (e) {}
        document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.id === id));
        stage.style.animation = "none";
        void stage.offsetWidth;
        stage.style.animation = "";
        stage.innerHTML = "";
        MODS[id].render(stage);
        window.scrollTo({ top: 0, behavior: S.calm ? "auto" : "smooth" });
      }
      const LEVELS = ["🌱 Fácil", "🌿 Médio", "🌳 Desafio"];

      // Moldura comum a toda atividade: título, botões de nível (🌱🌿🌳), bolinhas de
      // progresso e uma área "body" onde cada atividade desenha o seu conteúdo.
      // Devolve { body, lvl } (um objeto): quem chama usa só o que precisa.
      function shell(stage, m, opt = {}) {
        stage.innerHTML = "";
        const lvl = S.levels[m.id] || 1;
        const wrap = el("div", "mission");
        wrap.style.setProperty("--c", m.color);
        const head = el("div", "mhead");
        head.append(el("h2", "", `${m.icon} ${m.title}`));
        if (!opt.noLevels) {
          const lv = el("div", "levels");
          LEVELS.forEach((L, i) => {
            const b = el("button", "lvbtn" + (lvl === i + 1 ? " on" : ""), L);
            b.onclick = () => {
              S.levels[m.id] = i + 1;
              R[m.id] = 0;
              save();
              SFX.click();
              go(m.id);
            };
            lv.append(b);
          });
          head.append(lv);
        }
        if (!opt.noDots) {
          const d = el("div", "dots");
          d.id = "dots";
          for (let i = 0; i < 5; i++) d.append(el("span", "dot"));
          head.append(d);
        }
        const body = el("div", "mbody");
        wrap.append(head, body);
        stage.append(wrap);
        renderDots(m.id);
        if (introduced.has(m.id)) say(pick(AGAIN), "happy");
        else {
          introduced.add(m.id);
          say(INTRO[m.id], "happy");
        }
        return { body, lvl };
      }

      function renderDots(id) {
        const d = $("#dots");
        if (!d) return;
        [...d.children].forEach((s, i) => s.classList.toggle("full", i < (R[id] || 0)));
      }

      function updateStars() {
        $("#starCount").textContent = S.stars;
      }

      /* ===================== Recompensas ===================== */
      // Reforço positivo: acertar sempre gera estrela, som e confete. Nunca há perda de pontos.
      // Chamada quando a criança acerta. Soma uma estrela, atualiza as bolinhas, toca os sons, comemora e, ao completar 5 missões, abre a janela de fim de rodada (com sugestão de pausa).
      function win(id, msg) {
        S.stars++;
        R[id] = (R[id] || 0) + 1;
        save();
        updateStars();
        renderDots(id);
        SFX.good();
        setTimeout(SFX.star, 380);
        confetti(30);
        const a = ACH.find((x) => x[0] === S.stars);
        if (a) {
          say(`Uau! ${S.stars} estrelas! Você ganhou: ${a[2]}!`, "cheer");
          setTimeout(() => confetti(160), 400);
        } else say(msg || pick(PRAISE), "cheer");
        if (R[id] >= 5) {
          R[id] = 0;
          setTimeout(() => roundDone(id), 1100);
        }
      }

      // Monta a janelinha de fim de rodada. Repare: o HTML vem de um template literal (texto entre crases `...`), e depois ligamos o onclick de cada botão.
      function roundDone(id) {
        markDone(id);
        confetti(160);
        SFX.star();
        const d = $("#roundDlg");
        d.innerHTML = `<h2>🏆 Rodada completa!</h2><p style="font-weight:700">Você fez 5 missões seguidas. Seu cérebro trabalhou bastante e merece descansar um pouquinho.</p><div class="dlgbtns"><button class="bigbtn" id="r1">🌙 Pausa de 1 minuto</button><button class="bigbtn alt" id="r2">▶ Mais uma rodada</button><button class="bigbtn ghost" id="r3">🏠 Voltar ao início</button></div>`;
        $("#r1", d).onclick = () => {
          d.close();
          go("pausa");
        };
        $("#r2", d).onclick = () => {
          d.close();
          go(id);
        };
        $("#r3", d).onclick = () => {
          d.close();
          go("home");
        };
        if (!d.open) d.showModal();
      }

      /* ===================== Teclado numérico ===================== */
      // Um COMPONENTE reutilizável: toda atividade que precisa de uma resposta numérica usa este mesmo teclado de tela (e também aceita o teclado do computador).
      // Cria o teclado numérico. Devolve um objeto "api" com ações (press, clear, set,
      // destroy). "val" é uma variável PRIVADA: só as funções criadas aqui dentro
      // enxergam. Isso se chama closure (fechamento).
      function keypad(parent, onSubmit) {
        const box = el("div", "kp"),
          disp = el("div", "kpdisp", "?"),
          grid = el("div", "kpgrid");
        let val = "";
        const upd = () => {
          disp.textContent = val || "?";
        };
        const api = {
          el: box,
          press(k) {
            if (k === "⌫") val = val.slice(0, -1);
            else if (k === "✔") {
              if (val !== "") {
                SFX.click();
                onSubmit(parseInt(val, 10));
              }
              return;
            } else if (val.length < 3) val += k;
            SFX.click();
            upd();
          },
          clear() {
            val = "";
            upd();
          },
          set(v) {
            val = String(v);
            upd();
          },
          destroy() {
            if (activeKeypad === api) activeKeypad = null;
            box.remove();
          },
        };
        ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "✔"].forEach((k) => {
          const b = el("button", "kpkey" + (k === "✔" ? " ok" : ""), k);
          b.onclick = () => api.press(k);
          b.setAttribute("aria-label", k === "⌫" ? "apagar" : k === "✔" ? "confirmar" : k);
          grid.append(b);
        });
        box.append(disp, grid);
        parent.append(box);
        activeKeypad = api;
        return api;
      }

      // Escuta o teclado FÍSICO: números digitam, Backspace apaga, Enter confirma. Só reage se houver um teclado de tela ativo e nenhuma janela aberta.
      document.addEventListener("keydown", (e) => {
        if (
          !activeKeypad ||
          !document.body.contains(activeKeypad.el) ||
          document.querySelector("dialog[open]")
        )
          return;
        if (/^\d$/.test(e.key)) activeKeypad.press(e.key);
        else if (e.key === "Backspace") activeKeypad.press("⌫");
        else if (e.key === "Enter") activeKeypad.press("✔");
      });

      function nextBtn(mod, fn) {
        const b = el("button", "bigbtn", "Próxima missão ➜");
        b.onclick = () => {
          SFX.click();
          fn ? fn() : go(mod);
        };
        return b;
      }
      /* Pergunta numérica com dicas gentis: nunca pune, sempre ensina */
      // Faz uma pergunta numérica com dicas gentis. "hints" é uma lista: cada erro usa a
      // próxima dica (pode ser texto OU uma função, como uma animação). Quando acabam
      // as dicas, mostramos a resposta e pedimos para a criança digitar: nunca punimos.
      function askNumber(box, { mod, question, answer, hints = [], done, onRight }) {
        box.innerHTML = "";
        box.append(el("div", "question", question));
        let tries = 0;
        const kp = keypad(box, (v) => {
          if (v === answer) {
            kp.destroy();
            box.innerHTML = "";
            box.append(el("div", "question", "🎉 " + (done || "Resposta certa!")));
            onRight && onRight(box);
            if (mod) box.append(nextBtn(mod));
          } else {
            tries++;
            SFX.oops();
            kp.clear();
            kp.el.classList.remove("shake");
            void kp.el.offsetWidth;
            kp.el.classList.add("shake");
            const h = hints[tries - 1];
            if (typeof h === "function") h();
            else if (h) say(h, "think");
            else {
              say(`Tudo bem, errar faz parte! A resposta é ${answer}. Digite ${answer} e aperte ✔.`, "think");
              kp.set(answer);
            }
          }
        });
        return kp;
      }

      /* ===================== Arrastar e soltar ===================== */
      // POINTER EVENTS: uma API única para mouse, toque e caneta. Eventos usados:
      // pointerdown (encostou), pointermove (arrastou), pointerup (soltou).
      // Descobre qual "zona" de soltar (elemento com classe .zone) está sob o ponteiro. elementsFromPoint lista tudo que está naquele ponto, do topo para o fundo; ignoramos a própria peça.
      function zoneAt(x, y, tok) {
        for (const e of document.elementsFromPoint(x, y)) {
          if (e === tok || tok.contains(e)) continue;
          const z = e.closest && e.closest(".zone");
          if (z) return z;
        }
        return null;
      }

      // Torna uma peça arrastável. Ideia central: ao arrastar NÃO mudamos a peça de
      // lugar; apenas aplicamos transform: translate(dx, dy) para ela acompanhar o dedo.
      // Ao soltar: se caiu numa zona válida, onDrop decide; se não, removemos o transform
      // e a transição CSS faz a peça voltar sozinha. Se quase não se moveu, é um toque (onTap).
      function makeDraggable(tok, { onDrop, onTap }) {
        tok.addEventListener("pointerdown", (e) => {
          if (tok.dataset.locked) return;
          e.preventDefault();
          try {
            // "Captura" o ponteiro: mesmo que o dedo saia de cima da peça, ela continua recebendo os eventos até soltar.
            tok.setPointerCapture(e.pointerId);
          } catch (_) {}
          const sx = e.clientX,
            sy = e.clientY;
          let moved = false,
            hot = null;
          tok.classList.add("drag");
          SFX.pick();

          // Roda a cada movimento: calcula quanto o dedo andou (dx, dy) e acompanha, com leve inclinação para parecer "pegar" a peça. Também acende a zona que está embaixo.
          const move = (ev) => {
            const dx = ev.clientX - sx,
              dy = ev.clientY - sy;
            if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
            tok.style.transform = `translate(${dx}px,${dy}px) scale(1.15) rotate(${Math.max(-12, Math.min(12, dx / 20))}deg)`;
            const z = zoneAt(ev.clientX, ev.clientY, tok);
            if (z !== hot) {
              hot && hot.classList.remove("hot");
              hot = z;
              hot && hot.classList.add("hot");
            }
          };

          // Roda ao soltar: remove os "escutadores" temporários (removeEventListener) e decide entre toque, soltar numa zona ou voltar ao lugar.
          const up = (ev) => {
            tok.removeEventListener("pointermove", move);
            tok.removeEventListener("pointerup", up);
            tok.removeEventListener("pointercancel", up);
            hot && hot.classList.remove("hot");
            tok.classList.remove("drag");
            if (!moved) {
              tok.style.transform = "";
              onTap && onTap(tok);
              return;
            }
            const z = zoneAt(ev.clientX, ev.clientY, tok);
            tok.style.transform = "";
            if (!(z && onDrop && onDrop(tok, z) !== false)) {
              /* volta suavemente */
            }
          };
          tok.addEventListener("pointermove", move);
          tok.addEventListener("pointerup", up);
          tok.addEventListener("pointercancel", up);
        });
      }

      // Fábrica de peças: "u" = unidade (emoji ou cubinho), "t" = barra de 10. dataset.v guarda o valor da peça dentro do próprio elemento HTML (atributo data-v).
      function mkTok(kind, v, emoji, small) {
        const t = el("div", "tok");
        t.dataset.v = v;
        t.dataset.k = kind;
        if (kind === "t") {
          t.classList.add("t");
          t.innerHTML = "<i></i>".repeat(10);
          t.setAttribute("aria-label", "dezena (10)");
        } else if (emoji) {
          t.classList.add("u", "emo");
          if (small) t.classList.add("sm");
          t.textContent = emoji;
        } else t.classList.add("u", "cube");
        return t;
      }

      // Texto do valor posicional: place(23) → "2 dezenas e 3 unidades". O .filter(Boolean) descarta textos vazios antes de juntar com " e ".
      function place(v) {
        const t = Math.floor(v / 10),
          u = v % 10;
        return (
          [t ? `${t} dezena${t > 1 ? "s" : ""}` : "", u ? `${u} unidade${u > 1 ? "s" : ""}` : ""]
            .filter(Boolean)
            .join(" e ") || "0"
        );
      }

      // Mostra uma multiplicação como arranjo: r linhas de c bolinhas. animationDelay escalonado faz as bolinhas surgirem uma depois da outra.
      function arrayView(r, c) {
        const w = el("div", "arrbox");
        w.innerHTML = `<div class="arrcap">${r} linhas de ${c} = ${r} × ${c}</div>`;
        const g = el("div", "arr");
        g.style.gridTemplateColumns = `repeat(${c},22px)`;
        for (let i = 0; i < r * c; i++) {
          const d = el("i");
          d.style.animationDelay = i * 25 + "ms";
          g.append(d);
        }
        w.append(g);
        return w;
      }

      /* ===================== ➕ SOMAR ===================== */
      // PADRÃO DE TODAS AS ATIVIDADES (vale para Somar, Subtrair, Multiplicar, Dividir):
      //   1. shell()      → cria a moldura e descobre o nível (lvl)
      //   2. sorteio      → escolhe os números do problema conforme o nível
      //   3. innerHTML    → monta a tela com um template literal
      //   4. peças        → cria as peças e liga o arrastar (makeDraggable)
      //   5. regras       → funções que reagem às ações e validam
      //   6. askNumber    → pergunta a resposta; ao acertar chama win()
      function renderSoma(stage) {
        const m = MODS.soma,
          { body, lvl } = shell(stage, m);
        let a, b;

        // NÍVEIS: cada nível é só um intervalo de números diferente. rnd(1, 8) sorteia de 1 a 8. Mudar a dificuldade do jogo = mudar estes números!
        if (lvl === 1) {
          a = rnd(1, 8);
          b = rnd(1, Math.min(9, 10 - a));
        } else if (lvl === 2) {
          a = rnd(4, 14);
          b = rnd(Math.max(3, 11 - a), 20 - a);
        } else {
          a = rnd(12, 48);
          b = rnd(11, Math.min(49, 98 - a));
        }
        const blocks = lvl > 1,
          emoji = pick(FOODS),
          total = a + b;
        let sum = 0;
        body.innerHTML = `<div class="story">${blocks ? `Junte <b>${a}</b> com <b>${b}</b>` : `Tenho <b>${a}</b> ${emoji} e ganhei mais <b>${b}</b> ${emoji}`}</div>
  <div class="eq"><span class="n">${a}</span><span class="op">+</span><span class="n">${b}</span><span class="op">=</span><span class="n r" id="eqr">?</span></div>
  <div class="trays"><div class="tray A"><div class="tlabel">Grupo 1 · ${a}</div><div class="pile" id="pa"></div></div><div class="tray B"><div class="tlabel">Grupo 2 · ${b}</div><div class="pile" id="pb"></div></div></div>
  <div class="zone basket" id="basket"><div class="tlabel">🧺 Arraste (ou toque) as peças para a cesta</div><div class="pile" id="inb"></div><div class="count" id="cnt">0</div></div>
  <div class="ask" id="ask"></div>
  <div class="tools"><button class="tool" id="hintB">💡 Dica</button><button class="tool" id="redo">🔄 Outro problema</button></div>`;
        body.style.setProperty("--c", m.color);
        const inb = $("#inb", body),
          cnt = $("#cnt", body);

        // Coloca uma peça na cesta: soma o valor (data-v) ao total, toca uma nota que sobe a cada peça e, quando o total fecha a conta, pergunta a resposta.
        const put = (tok) => {
          const v = +tok.dataset.v;
          tok.dataset.locked = "1";
          inb.append(tok);
          sum += v;
          SFX.count(inb.children.length - 1);
          cnt.innerHTML = sum + (blocks ? `<small>${place(sum)}</small>` : "");
          if (sum === total) askIt();
          return true;
        };

        // Cria as peças de um número. Com blocos: 23 = 2 barras de 10 + 3 cubinhos (a ideia do material dourado!). Sem blocos: 23 emojis.
        const mk = (n, pile) => {
          const toks = [];
          if (blocks) {
            for (let i = 0; i < Math.floor(n / 10); i++) toks.push(mkTok("t", 10));
            for (let i = 0; i < n % 10; i++) toks.push(mkTok("u", 1));
          } else for (let i = 0; i < n; i++) toks.push(mkTok("u", 1, emoji));
          toks.forEach((t) => {
            makeDraggable(t, { onDrop: (tk, z) => (z.id === "basket" ? put(tk) : false), onTap: put });
            pile.append(t);
          });
        };
        mk(a, $("#pa", body));
        mk(b, $("#pb", body));

        // Hora de responder! askNumber mostra o teclado; as dicas vão ficando mais claras a cada erro.
        function askIt() {
          say(`Juntamos tudo na cesta! Quanto é ${a} + ${b}?`, "think");
          askNumber($("#ask", body), {
            mod: "soma",
            question: `Quanto é ${a} + ${b}?`,

            done: `${a} + ${b} = ${total}`,

              `Comece em ${a} e conte mais ${b}: ${a}, ${a + 1}, ${a + 2}...`,

        $("#hintB", body).onclick = () =>
          say(
            blocks
              ? "Cada barra azul vale 10 e cada cubinho vale 1. Junte tudo na cesta!"
              : "Leve o grupo 1 e depois o grupo 2 para a cesta. Depois é só olhar o número!",
            "happy",
          );

      /* ===================== ➖ SUBTRAIR ===================== */
      // Aqui entra o "empréstimo": se faltar cubinho, tocamos na barra azul e ela se quebra em 10 cubinhos. É a conta de "pedir emprestado" feita com as mãos.
      function renderSub(stage) {
        const m = MODS.sub,
          { body, lvl } = shell(stage, m);
        let a, b;
        if (lvl === 1) {
          a = rnd(4, 10);
          b = rnd(1, a - 1);

        let eaten = 0;
        body.innerHTML = `<div class="story">${blocks ? `Tire <b>${b}</b> de <b>${a}</b>` : `Tenho <b>${a}</b> ${emoji}. O Gulosinho vai comer <b>${b}</b>!`}</div>
  <div class="eq"><span class="n">${a}</span><span class="op">−</span><span class="n">${b}</span><span class="op">=</span><span class="n r" id="eqr">?</span></div>
  <div class="tray T"><div class="tlabel">🍽️ Mesa · tem <b id="left">${a}</b></div><div class="pile" id="tbl"></div></div>
  <div class="zone monster" id="mon"><div class="face">👾</div><div class="tlabel" id="mlab">Gulosinho já comeu 0 de ${b}</div></div>
  <div class="ask" id="ask"></div>
  <div class="tools"><button class="tool" id="hintB">💡 Dica</button><button class="tool" id="redo">🔄 Outro problema</button></div>`;
        body.style.setProperty("--c", m.color);
        const mon = $("#mon", body),
          tbl = $("#tbl", body);
        const attach = (t) =>
          makeDraggable(t, {
            onDrop: (tk, z) => (z.id === "mon" ? eat(tk) : false),
            onTap: (tk) => (tk.dataset.k === "t" ? breakTen(tk) : eat(tk)),
          });

        // replaceWith(...lista) troca UMA peça por VÁRIAS no mesmo lugar. O "..." (spread) espalha a lista como argumentos separados.
        function breakTen(tok) {
          SFX.pick();
          const f = [];
          for (let i = 0; i < 10; i++) {
            const u = mkTok("u", 1);
            attach(u);
            f.push(u);
          }
          tok.replaceWith(...f);

        // Regras do Gulosinho: ele só come até a quantidade pedida, e uma barra inteira (10) só cabe se faltar 10 ou mais. Retornar false faz a peça voltar ao lugar.
        function eat(tok) {

          say(
            blocks
              ? "Se faltar cubinho, toque na barra azul para quebrá-la em 10!"
              : "Arraste as peças para o Gulosinho até ele comer a quantidade certa.",

          );
